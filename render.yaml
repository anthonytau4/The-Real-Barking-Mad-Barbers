services:
  - type: web
    name: barking-mad-barbers
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: SERVE_FRONTEND
        value: "true"
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
