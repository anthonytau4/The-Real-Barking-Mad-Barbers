<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Barking Mad Barbers | Dog Grooming Tawa</title>
  <meta name="description" content="Premium dog grooming in Tawa, Wellington. Book online, ask the grooming helper, or text Barking Mad Barbers." />
  <link rel="icon" type="image/png" href="/assets/favicon.png" />
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    :root{--ink:#16130f;--muted:#665d52;--line:#e7d7bd;--gold:#b78228;--cream:#fff9f0;--soft:#f7efe3;--dark:#17130e;--shadow:0 18px 48px rgba(22,19,15,.12);--max:1120px}
    *{box-sizing:border-box} body{margin:0;color:var(--ink);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(135deg,#fffdf8,#f8efe1 52%,#fff9f0)} a{color:inherit;text-decoration:none} img{max-width:100%;display:block} button,input,select,textarea{font:inherit}.top{height:6px;background:linear-gradient(90deg,#8f6116,#e7c778,#8f6116)}
    .nav{position:sticky;top:0;z-index:10;background:rgba(255,249,240,.92);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}.navin{max-width:var(--max);margin:auto;padding:14px 18px;display:flex;gap:18px;align-items:center;justify-content:space-between}.brand{display:flex;gap:12px;align-items:center;font-weight:950;letter-spacing:.08em;text-transform:uppercase}.brand img{width:58px}.links{display:flex;gap:7px;flex-wrap:wrap;align-items:center}.links a,.btn{border:0;border-radius:999px;padding:11px 15px;font-weight:850}.links a.active,.links a:hover{background:#fff;box-shadow:inset 0 0 0 1px var(--line)}.btn{cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}.gold{color:var(--gold)}.btn.gold{background:linear-gradient(135deg,#9c6717,#d5aa4e);color:#fff;box-shadow:0 12px 26px rgba(183,130,40,.25)}.btn.dark{background:var(--dark);color:#fff}.btn.soft{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
    main{min-height:72vh}.wrap{max-width:var(--max);margin:auto;padding:42px 18px}.hero{display:grid;grid-template-columns:.9fr 1.1fr;gap:34px;align-items:center}.eyebrow{color:var(--gold);font-size:12px;font-weight:950;letter-spacing:.2em;text-transform:uppercase}.display,.page-title{font-family:Georgia,"Times New Roman",serif;line-height:.95;letter-spacing:-.04em}.display{font-size:clamp(52px,8vw,92px);margin:18px 0}.page-title{font-size:clamp(48px,7vw,82px);margin:12px 0}.lead{font-size:19px;line-height:1.7;color:#4f463d;font-weight:600}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}.poster{background:#fff;border:1px solid var(--line);border-radius:24px;padding:10px;box-shadow:var(--shadow)}.poster img{border-radius:18px;width:100%}.grid{display:grid;gap:16px}.grid3{grid-template-columns:repeat(3,1fr)}.grid2{grid-template-columns:repeat(2,1fr)}.card{background:rgba(255,255,255,.78);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:var(--shadow)}.card h3{font-family:Georgia,"Times New Roman",serif;font-size:28px;margin:0 0 9px}.card p{color:var(--muted);line-height:1.65;font-weight:600}.split{display:grid;grid-template-columns:1fr 1fr;gap:18px}.form{display:grid;gap:14px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:7px}label{font-weight:850}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:15px;padding:13px 14px;background:#fff;color:var(--ink)}textarea{min-height:112px;resize:vertical}.status{border:1px solid var(--line);border-radius:15px;background:#fff;padding:13px 14px;line-height:1.55;font-weight:650}.status.good{background:#f2fff6;border-color:#b8dfc1;color:#235d31}.status.bad{background:#fff4f2;border-color:#efc3bb;color:#8b2b22}.dogbox{border:1px dashed var(--line);border-radius:18px;padding:14px;display:grid;gap:12px;background:#fffdf9}.doghead{display:flex;justify-content:space-between;align-items:center;gap:10px}.list{display:grid;gap:12px}.booking{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px}.tag{display:inline-flex;border-radius:999px;background:#f2dfba;color:#7a510f;padding:5px 10px;font-size:12px;font-weight:900}.divider{display:flex;align-items:center;gap:12px;color:var(--muted);font-weight:800}.divider:before,.divider:after{content:"";height:1px;background:var(--line);flex:1}.googlebox{min-height:42px}.footer{background:#15110d;color:#fff;margin-top:36px}.footer .wrap{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:24px}.footer p,.footer a{color:#eadfce;line-height:1.7}.hidden{display:none}
    @media(max-width:850px){.navin{align-items:flex-start;flex-direction:column}.hero,.split,.grid2,.grid3,.footer .wrap{grid-template-columns:1fr}.row{grid-template-columns:1fr}.links{width:100%}.links a,.links .btn{flex:1;text-align:center}.wrap{padding:30px 14px}.display{font-size:52px}}
  </style>
</head>
<body><div class="top"></div><header class="nav"><div class="navin"><a class="brand" href="/" data-link><img src="/assets/brand-logo.png" alt="Barking Mad Barbers logo"><span>Barking Mad Barbers</span></a><nav class="links" id="nav"></nav></div></header><main id="app"></main><footer class="footer"><div class="wrap"><div><h3>Barking Mad <span class="gold">Barbers</span></h3><p>Premium dog grooming in Tawa, Wellington.</p></div><div><h3>Visit</h3><p>5A Tawa Street<br>Tawa, Wellington<br>Bookings only</p></div><div><h3>Contact</h3><p><a href="sms:0272472493">027 247 2493</a><br><a href="mailto:barkingmadbarbers@gmail.com">barkingmadbarbers@gmail.com</a><br>Mon-Sat 8:30-3:00</p></div></div></footer>
<script>
const API_BASE_URL=(window.BMB_API_BASE_URL||'https://barking-mad-backend.onrender.com').replace(/\/+$/,''); const PHONE='0272472493';
const navItems=[['Home','/'],['Services','/services'],['Sanctuary','/Sanctuary'],['Our Family','/our-family'],['Team','/team'],['Helper','/helper'],['Contact','/contact'],['Sign in','/sign-in'],['Admin','/admin'],['Book','/book']];
const $=s=>document.querySelector(s); const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function key(path=location.pathname){let p=decodeURIComponent(path).replace(/\/+$/,'').toLowerCase()||'/'; if(p==='/sanctuary')return'sanctuary'; if(['/our-family','/ourfamily','/family'].includes(p))return'our-family'; if(['/book','/booking','/bookings'].includes(p))return'book'; if(['/helper','/help'].includes(p))return'helper'; if(['/sign-in','/signin','/login'].includes(p))return'sign-in'; return p.slice(1)||'home'}
function setNav(){$('#nav').innerHTML=navItems.map(([n,u])=>`<a href="${u}" data-link class="${key(u)===key()?'active':''} ${n==='Book'?'btn gold':''}">${n}</a>`).join('')} function bindLinks(){document.querySelectorAll('[data-link]').forEach(a=>a.onclick=e=>{const u=new URL(a.href); if(u.origin===location.origin){e.preventDefault(); history.pushState({},'',u.pathname); render();}})}
async function api(path,opts={}){const res=await fetch(API_BASE_URL+path,{headers:{'Content-Type':'application/json',...(opts.headers||{})},...opts}); const data=await res.json().catch(()=>({detail:'Could not read server response.'})); if(!res.ok){const err=new Error(Array.isArray(data.detail)?data.detail.map(d=>d.msg).join(', '):(data.detail||data.message||'Request failed')); err.status=res.status; throw err} return data}
function fd(form){return Object.fromEntries(new FormData(form).entries())} function status(id,msg,kind=''){const el=$(id); if(el)el.innerHTML=`<div class="status ${kind}">${msg}</div>`}
function token(){return localStorage.getItem('bmb_token')||''} function profile(){try{return JSON.parse(localStorage.getItem('bmb_profile')||'{}')}catch{return {}}} function authHeaders(){return token()?{Authorization:'Bearer '+token()}: {}} function saveAuth(data){const t=data.token||data.access_token||data.jwt; if(t)localStorage.setItem('bmb_token',t); const p=data.user||data.profile||data.account||{}; if(p.email||p.name)localStorage.setItem('bmb_profile',JSON.stringify(p)); return hydrateMe()} function clearAuth(){localStorage.removeItem('bmb_token');localStorage.removeItem('bmb_profile')} function authErr(e){return e&&(e.status===401||/not authenticated|sign in|required|admin/i.test(e.message||''))}
async function hydrateMe(){if(!token())return null; try{const me=await api('/api/auth/me',{headers:authHeaders()}); const p=me.user||me.profile||me; if(p&&typeof p==='object')localStorage.setItem('bmb_profile',JSON.stringify(p)); return p}catch(e){if(authErr(e))clearAuth(); return null}}
function signedInLine(){const p=profile(); return token()?`<div class="status good">Signed in${p.email?' as '+esc(p.email):''}. This same sign-in is used for admin when the Gmail matches ADMIN_EMAILS.</div><button class="btn soft" onclick="clearAuth();render()">Sign out</button>`:'<div class="status">Not signed in on this device yet.</div>'}
function smsUrl(data){const lines=['Hi Barking Mad Barbers, I would like to enquire about booking a groom.','Please text when you can, as you may be with a dog and unable to answer calls.','If a phone call is easier, please text and let me know. I understand you will call back when you are able.','',`Name: ${data.owner_name||''}`,`Phone: ${data.phone||''}`,`Email: ${data.email||''}`,`Preferred date: ${data.preferred_date||''}`,`Preferred time: ${data.preferred_time||''}`,`Dogs: ${dogSummary()}`,`Notes: ${data.notes||''}`].filter(x=>x&&!x.endsWith(': ')); return `sms:${PHONE}?&body=${encodeURIComponent(lines.join('\n'))}`} function dogSummary(){return [...document.querySelectorAll('.dogbox')].map((box,i)=>{const g=n=>box.querySelector(`[name="${n}"]`)?.value||''; return `${i+1}. ${g('dog_name')} - ${g('dog_size')} - ${g('service')}`}).join('; ')}
async function initGoogle(){const box=$('#googleSignIn'); if(!box)return; try{const cfg=await api('/api/auth/google/config'); if(!cfg.enabled||!cfg.client_id){box.innerHTML='<div class="status">Google sign-in is not enabled yet.</div>';return} if(!window.google||!google.accounts||!google.accounts.id){setTimeout(initGoogle,350);return} google.accounts.id.initialize({client_id:cfg.client_id,callback:handleGoogleCredential,auto_select:false}); box.innerHTML=''; google.accounts.id.renderButton(box,{theme:'outline',size:'large',text:'continue_with',shape:'pill',width:300})}catch(e){box.innerHTML=`<div class="status bad">${esc(e.message)}</div>`}}
async function handleGoogleCredential(res){status('#signinStatus','Signing in with Google...'); try{const data=await api('/api/auth/google',{method:'POST',body:JSON.stringify({id_token:res.credential})}); await saveAuth(data); status('#signinStatus','Signed in with Google.','good'); showSession()}catch(e){status('#signinStatus',esc(e.message),'bad')}}
function hero(){return `<section class="wrap hero"><div><div class="eyebrow">Tawa dog grooming</div><h1 class="display">Groomed with <span class="gold">love.</span><br>Treated like <span class="gold">family.</span></h1><p class="lead">Premium, calm, appointment-only dog grooming in Tawa, Wellington.</p><div class="actions"><a class="btn gold" href="/book" data-link>Book a groom</a><a class="btn soft" href="/services" data-link>View services</a></div></div><div class="poster"><img src="/assets/hero-advert.png" alt="Barking Mad Barbers grooming price guide"></div></section>${cards()}`} function cards(){return `<section class="wrap"><div class="grid grid3"><article class="card"><h3>Calm care</h3><p>One-on-one grooming with a gentle, patient approach.</p></article><article class="card"><h3>Clear pricing</h3><p>Full Groom from $80 and Wash & Dry from $45.</p></article><article class="card"><h3>Easy contact</h3><p>Book online or send a ready-made text if the server is busy.</p></article></div></section>`}
function shell(title,kicker,copy,body){return `<section class="wrap"><div class="eyebrow">${kicker}</div><h1 class="page-title">${title}</h1><p class="lead">${copy}</p>${body}</section>`} function services(){return shell('Services & <span class="gold">Prices</span>','Premium grooming','Final pricing depends on size, coat condition and service.',`<div class="grid grid2"><article class="card"><h3>Full Groom</h3><p>Warm bath, shampoo and condition, blow dry, brush out, clip, face and feet finish, nail trim, ears and anal gland expression.</p><p><strong>Tiny $80, Small $90, Medium $110, Large $130</strong></p></article><article class="card"><h3>Wash & Dry</h3><p>Warm bath, shampoo and condition, blow dry, brush out, nail trim, anal gland expression and cologne.</p><p><strong>Tiny $45, Small $50, Medium $55, Large $60</strong></p></article></div><div class="card" style="margin-top:16px"><h3>Extras</h3><p>Flea shampoo $20, nail trim $20, teeth brush $10, face tidy $10, anal gland expression $20.</p></div>`)} function sanctuary(){return shell('Calm <span class="gold">Sanctuary</span>','Low-stress care','A clean, quiet, appointment-only space made for patient grooming.',cards())} function family(){return shell('Our <span class="gold">Family</span>','Loved like our own','Warm local care with a premium finish.',cards())} function team(){return shell('Meet the <span class="gold">Team</span>','Our team','Local Tawa care for dogs and their people.',`<div class="grid grid2"><article class="card"><img src="/assets/team-dog.webp" alt="Team member with dog" style="border-radius:16px;margin-bottom:14px"><h3>Dog-loving care</h3><p>Friendly, calm and focused on your dog.</p></article><article class="card"><img src="/assets/team-beach.webp" alt="Barking Mad Barbers family" style="border-radius:16px;margin-bottom:14px"><h3>Local family</h3><p>A Wellington grooming business with a personal feel.</p></article></div>`)}
function dogBox(i=1){return `<div class="dogbox"><div class="doghead"><strong>Dog ${i}</strong><button class="btn soft remove-dog" type="button">Remove</button></div><div class="row"><div class="field"><label>Dog name</label><input name="dog_name" required></div><div class="field"><label>Dog size</label><select name="dog_size" required><option value="">Choose size</option><option>Tiny</option><option>Small</option><option>Medium</option><option>Large</option></select></div></div><div class="field"><label>Service</label><select name="service" required><option value="">Choose service</option><option>Full Groom</option><option>Wash & Dry</option><option>Face Tidy</option><option>Nail Trim</option><option>Teeth Brush</option><option>Flea Shampoo</option></select></div></div>`} function book(){return shell('Book a <span class="gold">Groom</span>','Bookings only','Send a booking request. If the server is down, your phone opens a ready-made text to send.',`<div class="split"><form class="card form" id="bookingForm"><div class="row"><div class="field"><label>Your name</label><input name="owner_name" required autocomplete="name"></div><div class="field"><label>Phone</label><input name="phone" required autocomplete="tel"></div></div><div class="row"><div class="field"><label>Email</label><input name="email" type="email" autocomplete="email"></div><div class="field"><label>Preferred date</label><input name="preferred_date" type="date"></div></div><div class="field"><label>Preferred time</label><input name="preferred_time" placeholder="Morning / afternoon / exact time"></div><div id="dogs">${dogBox(1)}</div><button class="btn soft" id="addDog" type="button">Add dog</button><div class="field"><label>Notes</label><textarea name="notes" placeholder="Coat type, matting, fleas, nerves, anything we should know"></textarea></div><button class="btn gold" type="submit">Send booking request</button><div id="bookingStatus"></div></form><div class="card"><h3>Text is best</h3><p>We may be with a dog and unable to answer calls. Please text when you can. If a phone call is easier, send a quick text and we will call back when we are able.</p></div></div>`)}
function helper(){return shell('Grooming <span class="gold">Helper</span>','Gemini helper','Ask a quick grooming question.',`<div class="split"><form class="card form" id="helperForm"><div class="row"><div class="field"><label>Dog size</label><select name="dog_size"><option value="">Not sure</option><option>Tiny</option><option>Small</option><option>Medium</option><option>Large</option></select></div><div class="field"><label>Coat type</label><input name="coat_type" placeholder="Curly, long, double coat, matted"></div></div><div class="field"><label>Question</label><textarea name="question" required placeholder="Example: My dog has knots, should I book a full groom?"></textarea></div><button class="btn gold" type="submit">Ask helper</button><div id="helperStatus"></div></form><div class="card"><h3>Powered by Gemini</h3><p>For urgent health concerns, contact a vet.</p></div></div>`)} function contact(){return shell('Contact <span class="gold">Us</span>','Tawa, Wellington','Message to book, ask a question or confirm the best service.',`<div class="grid grid3"><article class="card"><h3>Phone</h3><p><a href="sms:${PHONE}">${PHONE}</a></p></article><article class="card"><h3>Email</h3><p><a href="mailto:barkingmadbarbers@gmail.com">barkingmadbarbers@gmail.com</a></p></article><article class="card"><h3>Location</h3><p>5A Tawa Street, Tawa, Wellington</p></article></div>`)}
function signin(){return shell('Sign in <span class="gold">once</span>','Google or email','Google sign-in and email/password both cache the current account on this device. Admin uses this same sign-in when the Gmail matches ADMIN_EMAILS.',`<div class="split"><form class="card form" id="signinForm"><div class="googlebox" id="googleSignIn"></div><div class="divider">or</div><div class="field"><label>Name</label><input name="name" required autocomplete="name"></div><div class="field"><label>Email</label><input name="email" type="email" required autocomplete="email"></div><div class="field"><label>Password</label><input name="password" type="password" required autocomplete="current-password"></div><button class="btn gold" type="submit">Sign in / create account</button><div id="signinStatus"></div></form><div class="card"><h3>Cached account</h3><div id="mySession" class="list"></div></div></div>`)} function admin(){return shell('Admin <span class="gold">Dashboard</span>','Same sign-in','Sign in normally first. If that Gmail is listed in ADMIN_EMAILS, bookings appear here.',`<div class="split"><div class="card"><h3>Current account</h3><div id="adminSession"></div><div class="actions"><a class="btn soft" href="/sign-in" data-link>Sign in</a><button class="btn dark" onclick="loadAdminBookings()">Refresh bookings</button></div></div><div class="card"><h3>Admin rule</h3><p>No separate admin account is needed. The signed-in Gmail must match the Render ADMIN_EMAILS value.</p></div></div><div id="adminBookings" class="wrap list"></div>`)}
function bindForms(){const b=$('#bookingForm'); if(b){$('#addDog').onclick=()=>{const d=$('#dogs'); d.insertAdjacentHTML('beforeend',dogBox(d.children.length+1)); refreshDogButtons()}; refreshDogButtons(); b.onsubmit=submitBooking} const h=$('#helperForm'); if(h)h.onsubmit=submitHelper; const s=$('#signinForm'); if(s){s.onsubmit=submitSignIn; showSession(); initGoogle()} const adminBox=$('#adminSession'); if(adminBox){adminBox.innerHTML=signedInLine(); loadAdminBookings(false)}} function refreshDogButtons(){document.querySelectorAll('.dogbox').forEach((box,i)=>{box.querySelector('strong').textContent=`Dog ${i+1}`; const btn=box.querySelector('.remove-dog'); btn.classList.toggle('hidden',document.querySelectorAll('.dogbox').length===1); btn.onclick=()=>{box.remove();refreshDogButtons()}})}
function bookingPayload(form){const d=fd(form), names=(d.owner_name||'').trim().split(/\s+/), first=names.shift()||'Customer', last=names.join(' ')||'-'; const firstDog=document.querySelector('.dogbox'); const g=n=>firstDog?.querySelector(`[name="${n}"]`)?.value||''; return {first_name:first,last_name:last,phone:d.phone||'',dog_name:g('dog_name'),service_type:g('service'),dog_size:g('dog_size'),extras:[],breed:'',preferred_date:d.preferred_date||'',preferred_time:d.preferred_time||'',estimated_total:0,notes:[d.email?`Email: ${d.email}`:'',d.notes||'',dogSummary()?`Dogs: ${dogSummary()}`:''].filter(Boolean).join('\n')}}
async function submitBooking(e){e.preventDefault(); const form=e.currentTarget, payload=bookingPayload(form); status('#bookingStatus','Sending booking request...'); try{await api('/api/bookings',{method:'POST',body:JSON.stringify(payload)}); form.reset(); status('#bookingStatus','Booking request sent. Barking Mad Barbers can confirm the details with you soon.','good')}catch(err){status('#bookingStatus','The online booking server is unavailable, so we are opening a text message with your enquiry ready to send.','good'); setTimeout(()=>{location.href=smsUrl(fd(form))},600)}}
async function submitHelper(e){e.preventDefault(); const d=fd(e.currentTarget); status('#helperStatus','Asking helper...'); try{const data=await api('/api/chat',{method:'POST',body:JSON.stringify({message:[d.question,d.dog_size?`Dog size: ${d.dog_size}`:'',d.coat_type?`Coat type: ${d.coat_type}`:''].filter(Boolean).join('\n'),history:[],provider:'gemini'})}); status('#helperStatus',esc(data.reply||data.answer||'Done.'),'good')}catch(err){status('#helperStatus',esc(err.message),'bad')}}
async function submitSignIn(e){e.preventDefault(); const d=fd(e.currentTarget); status('#signinStatus','Signing in...'); try{let data; try{data=await api('/api/auth/register',{method:'POST',body:JSON.stringify({name:d.name,email:d.email,password:d.password})})}catch{data=await api('/api/auth/login',{method:'POST',body:JSON.stringify({email:d.email,password:d.password})})} await saveAuth(data); status('#signinStatus','Signed in.','good'); showSession()}catch(err){status('#signinStatus',esc(err.message),'bad')}} function showSession(){const el=$('#mySession'); if(el)el.innerHTML=signedInLine()}
function bookingCard(b){return `<article class="booking"><strong>${esc(b.dog_name||'Dog')} - ${esc(b.service_type||b.service||'Service')}</strong> <span class="tag">${esc(b.status||'New')}</span><p>${esc([b.first_name,b.last_name].filter(Boolean).join(' '))} | ${esc(b.phone||'')}</p><p>${esc(b.dog_size||'')} ${esc(b.preferred_date||'')} ${esc(b.preferred_time||'')}</p><p>${esc(b.notes||'')}</p></article>`} async function loadAdminBookings(show=true){const el=$('#adminBookings'); if(!el)return; if(!token()){el.innerHTML='<div class="status">Sign in first, then come back here. Admin access depends on the signed-in Gmail matching ADMIN_EMAILS.</div>';return} try{await hydrateMe(); const d=await api('/api/admin/bookings',{headers:authHeaders()}); const list=d.bookings||d||[]; el.innerHTML=Array.isArray(list)&&list.length?list.map(bookingCard).join(''):'<div class="status good">Admin verified. No bookings yet.</div>'}catch(err){if(authErr(err)){el.innerHTML='<div class="status bad">This signed-in Gmail is not authenticated as admin. Make sure it is the Gmail in Render ADMIN_EMAILS, then sign in again.</div>';return} if(show)el.innerHTML=`<div class="status bad">${esc(err.message)}</div>`}}
function render(){setNav(); const views={home:hero,services,sanctuary,'our-family':family,team,book,helper,contact,'sign-in':signin,admin}; $('#app').innerHTML=(views[key()]||hero)(); bindLinks(); bindForms(); scrollTo(0,0)} addEventListener('popstate',render); render();
</script></body></html>
