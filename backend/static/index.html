ns{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}.poster,.card{background:rgba(255,255,255,.82);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:var(--shadow)}.poster{padding:10px}.poster img{border-radius:16px}.grid{display:grid;gap:16px}.grid2{grid-template-columns:repeat(2,1fr)}.grid3{grid-template-columns:repeat(3,1fr)}.split{display:grid;grid-template-columns:1fr 1fr;gap:18px}.form{display:grid;gap:13px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:7px}label{font-weight:850}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:15px;padding:13px 14px;background:#fff;color:var(--ink)}textarea{min-height:112px;resize:vertical}.status{border:1px solid var(--line);border-radius:15px;background:#fff;padding:13px 14px;line-height:1.55;font-weight:650}.status.good{background:#f2fff6;border-color:#b8dfc1;color:#235d31}.status.bad{background:#fff4f2;border-color:#efc3bb;color:#8b2b22}.dogbox{border:1px dashed var(--line);border-radius:18px;padding:14px;display:grid;gap:12px;background:#fffdf9}.doghead,.topline{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.list{display:grid;gap:12px;margin-top:16px}.item{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;box-shadow:0 8px 22px rgba(20,16,10,.07)}.tag{display:inline-flex;border-radius:999px;background:#17130e;color:#fff;padding:5px 10px;font-size:12px;font-weight:900}.tabs{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.tabs .active{background:#17130e;color:#fff}.divider{display:flex;align-items:center;gap:12px;color:var(--muted);font-weight:800}.divider:before,.divider:after{content:"";height:1px;background:var(--line);flex:1}.hidden{display:none!important}.chat-shell{display:grid;grid-template-columns:minmax(0,1.05fr) .95fr;gap:22px;align-items:stretch}.chat-phone{overflow:hidden;border:1px solid rgba(183,131,42,.22);border-radius:30px;background:#fff;box-shadow:var(--shadow);min-height:640px;display:grid;grid-template-rows:auto 1fr auto}.chat-head{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#fff,#fff8ec)}.avatar{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#17130e,#b7832a);color:#fff;font-weight:950}.chat-name{font-weight:950}.chat-sub{font-size:12px;color:var(--muted);font-weight:750}.chat-feed{padding:18px;display:flex;flex-direction:column;gap:12px;overflow:auto;max-height:480px;background:linear-gradient(180deg,#fffaf2,#f7efe3)}.msg-row{display:flex;gap:9px;align-items:flex-end}.msg-row.you{justify-content:flex-end}.bubble{max-width:min(78%,560px);padding:12px 14px;border-radius:22px;line-height:1.5;font-weight:650;box-shadow:0 5px 14px rgba(20,16,10,.07);white-space:pre-wrap}.bot .bubble{background:#fff;color:#2b251e;border-bottom-left-radius:7px}.you .bubble{background:linear-gradient(135deg,#0f8cff,#7f35ff);color:#fff;border-bottom-right-radius:7px}.tiny-avatar{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#17130e;color:#fff;font-size:12px;font-weight:950;flex:0 0 auto}.msg-meta{font-size:11px;color:#8a7d6d;padding:0 8px}.typing .bubble{color:#7d6d5b}.typing-dots{display:inline-flex;gap:4px}.typing-dots i{width:6px;height:6px;border-radius:50%;background:#b7832a;display:block;animation:pulse 1s infinite}.typing-dots i:nth-child(2){animation-delay:.15s}.typing-dots i:nth-child(3){animation-delay:.3s}@keyframes pulse{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-2px)}}.chat-composer{border-top:1px solid var(--line);padding:12px;background:#fff;display:grid;gap:10px}.chat-tools{display:grid;grid-template-columns:1fr 1fr;gap:10px}.chat-send{display:flex;gap:10px;align-items:end}.chat-send textarea{min-height:48px;max-height:120px;border-radius:24px;resize:vertical}.send-btn{width:50px;height:50px;border-r <body><div class="bar"></div><header class="nav"><div class="navin"><a class="brand" href="/" data-link><img src="/assets/brand-logo.png" alt="Barking Mad Barbers logo"><span>Barking Mad Barbers</span></a><nav class="links" id="nav"></nav></div></header><main id="app"></main><footer class="footer"><div class="wrap"><div><h3>Barking Mad <span class="goldtext">Barbers</span></h3><p>Premium dog grooming in Tawa, Wellington.</p></div><div><h3>Visit</h3><p>5A Tawa Street<br>Tawa, Wellington<br>Bookings only</p></div><div><h3>Contact</h3><p><a href="sms:0272472493">027 247 2493</a><br><a href="mailto:barkingmadbarbers@gmail.com">barkingmadbarbers@gmail.com</a><br>Mon-Sat 8:30-3:00</p></div></div></footer>
<script>
const API=(window.BMB_API_BASE_URL||'https://barking-mad-backend.onrender.com').replace(/\/+$/,'');const PHONE='0272472493';const navItems=[['Home','/'],['Services','/services'],['Sanctuary','/sanctuary'],['Our Family','/our-family'],['Team','/team'],['Helper','/helper'],['Contact','/contact'],['Sign in','/sign-in'],['Admin','/admin'],['Book','/book']];const $=s=>document.querySelector(s);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function key(path=location.pathname){let p=decodeURIComponent(path).replace(/\/+$/,'').toLowerCase()||'/';if(p==='/sanctuary')return'sanctuary';if(['/our-family','/ourfamily','/family'].includes(p))return'our-family';if(['/sign-in','/signin','/login'].includes(p))return'sign-in';return p.slice(1)||'home'}function nav(){const k=key();$('#nav').innerHTML=navItems.map(([n,u])=>`<a href="${u}" data-link class="${key(u)===k?'active':''} ${n==='Book'?'btn gold':''}">${n}</a>`).join('')}function links(){document.querySelectorAll('[data-link]').forEach(a=>a.onclick=e=>{const u=new URL(a.href);if(u.origin===location.origin){e.preventDefault();history.pushState({},'',u.pathname);render()}})}
async function api(path,o={}){const r=await fetch(API+path,{headers:{'Content-Type':'application/json',...(o.headers||{})},...o});const d=await r.json().catch(()=>({detail:'Could not read server response.'}));if(!r.ok){const e=new Error(Array.isArray(d.detail)?d.detail.map(x=>x.msg).join(', '):(d.detail||d.message||'Request failed'));e.status=r.status;throw e}return d}const fd=f=>Object.fromEntries(new FormData(f).entries());function status(id,msg,kind=''){const el=$(id);if(el)el.innerHTML=`<div class="status ${kind}">${msg}</div>`}function token(){return localStorage.getItem('bmb_token')||''}function profile(){try{return JSON.parse(localStorage.getItem('bmb_profile')||'{}')}catch{return {}}}function headers(){return token()?{Authorization:'Bearer '+token()}: {}}function clearAuth(){localStorage.removeItem('bmb_token');localStorage.removeItem('bmb_profile')}async function saveAuth(d){const t=d.token||d.access_token;if(t)localStorage.setItem('bmb_token',t);const p=d.user||d.profile||{};if(p.email)localStorage.setItem('bmb_profile',JSON.stringify(p));return p}function authErr(e){return e&&(e.status===401||/not authenticated|admin|sign in/i.test(e.message||''))}
function hero(){return `<section class="wrap hero"><div><div class="eyebrow">Tawa dog grooming</div><h1 class="display">Groomed with <span class="goldtext">love.</span><br>Treated like <span class="goldtext">family.</span></h1><p class="lead">Premium, calm, appointment-only dog grooming in Tawa, Wellington.</p><div class="actions"><a class="btn gold" href="/book" data-link>Book a groom</a><a class="btn soft" href="/services" data-link>View services</a></div></div><div class="poster"><img src="/assets/hero-advert.png" alt="Barking Mad Barbers grooming price guide"></div></section><section class="wrap grid grid3"><article class="card"><h3>Calm care</h3><p>One-on-one grooming with a gentle, patient approach.</p></article><article class="card"><h3>Clear pricing</h3><p>Full Groom from $80 and Wash & Dry from $45.</p></article><article class="card"><h3>Text is best</h3><p>Please text when possible. If a call is easier, text first and we will call back when able.</p></article></section>`}function shell(t,k,c,b){return `<section class="wrap"><div class="eyebrow">${k}</div><h1 class="title">${t}</h1><p class="lead">${c}</p>${b}</section>`}function services(){return shell('Services & <span class="goldtext">Prices</span>','Premium grooming','Final pricing depends on size, coat condition and service.',`<div class="grid grid2"><article class="card"><h3>Full Groom</h3><p>Warm bath, shampoo and condition, blow dry, brush out, clip, face and feet finish, nail trim, ears and anal gland expression.</p><p><strong>Tiny $80, Small $90, Medium $110, Large $130</strong></p></article><article class="card"><h3>Wash & Dry</h3><p>Warm bath, shampoo and condition, blow dry, brush out, nail trim, anal gland expression and cologne.</p><p><strong>Tiny $45, Small $50, Medium $55, Large $60</strong></p></article></div>`)}function sanctuary(){return shell('Calm <span class="goldtext">Sanctuary</span>','Low-stress care','A clean, quiet, appointment-only space made for patient grooming.',`<div class="grid grid3"><article class="card"><h3>Calm first</h3><p>We work around comfort and coat condition.</p></article><article class="card"><h3>One-on-one</h3><p>Less rush, more care for each dog.</p></article><article class="card"><h3>Premium finish</h3><p>Gentle products and tidy grooming standards.</p></article></div>`)}function team(){return shell('Meet the <span class="goldtext">Team</span>','Our team','Local Tawa care for dogs and their people.',`<div class="grid grid2"><article class="card"><img src="/assets/team-dog.webp" alt="Team member with dog" style="border-radius:16px;margin-bottom:14px"><h3>Dog-loving care</h3><p>Friendly, calm and focused on your dog.</p></article><article class="card"><img src="/assets/team-beach.webp" alt="Barking Mad Barbers family" style="border-radius:16px;margin-bottom:14px"><h3>Local family</h3><p>A Wellington grooming business with a personal feel.</p></article></div>`)}
function dogBox(i=1){return `<div class="dogbox"><div class="doghead"><strong>Dog ${i}</strong><button class="btn soft remove-dog" type="button">Remove</button></div><div class="row"><div class="field"><label>Dog name</label><input name="dog_name" required></div><div class="field"><label>Dog size</label><select name="dog_size" required><option value="">Choose size</option><option>Tiny</option><option>Small</option><option>Medium</option><option>Large</option></select></div></div><div class="field"><label>Service</label><select name="service" required><option value="">Choose service</option><option>Full Groom</option><option>Wash & Dry</option><option>Face Tidy</option><option>Nail Trim</option><option>Teeth Brush</option><option>Flea Shampoo</option></select></div></div>`}function refreshDogs(){document.querySelectorAll('.dogbox').forEach((b,i)=>{b.querySelector('strong').textContent=`Dog ${i+1}`;const btn=b.querySelector('.remove-dog');btn.classList.toggle('hidden',document.querySelectorAll('.dogbox').length===1);btn.onclick=()=>{b.remove();refreshDogs()}})}function dogSummary(){return [...document.querySelectorAll('.dogbox')].map((b,i)=>{const g=n=>b.querySelector(`[name="${n}"]`)?.value||'';return `${i+1}. ${g('dog_name')} - ${g('dog_size')} - ${g('service')}`}).join('; ')}function smsUrl(d){const lines=['Hi Barking Mad Barbers, I would like to enquire about booking a groom.','Please text when you can, as you may be with a dog and unable to answer calls.','If a phone call is easier, please text and let me know. I understand you will call back when you are able.','',`Name: ${d.owner_name||''}`,`Phone: ${d.phone||''}`,`Email: ${d.email||''}`,`Preferred date: ${d.preferred_date||''}`,`Preferred time: ${d.preferred_time||''}`,`Dogs: ${dogSummary()}`,`Notes: ${d.notes||''}`].filter(x=>x&&!x.endsWith(': '));return `sms:${PHONE}?&body=${encodeURIComponent(lines.join('\n'))}`}
function book(){return shell('Book a <span class="goldtext">Groom</span>','Bookings only','Send a booking request. If the server is down, your phone opens a ready-made text.',`<div class="split"><form class="card form" id="bookingForm"><div class="row"><div class="field"><label>Your name</label><input name="owner_name" required autocomplete="name"></div><div class="field"><label>Phone</label><input name="phone" required autocomplete="tel"></div></div><div class="row"><div class="field"><label>Email</label><input name="email" type="email" autocomplete="email"></div><div class="field"><label>Preferred date</label><input name="preferred_date" type="date"></div></div><div class="field"><label>Preferred time</label><input name="preferred_time" placeholder="Morning / afternoon / exact time"></div><div id="dogs">${dogBox(1)}</div><button class="btn soft" id="addDog" type="button">Add dog</button><div class="field"><label>Notes</label><textarea name="notes"></textarea></div><button class="btn gold" type="submit">Send booking request</button><div id="bookingStatus"></div></form><div class="card"><h3>Text is best</h3><p>We may be with a dog and unable to answer calls. Please text when you can. If a call is easier, send a quick text and we will call back when able.</p></div></div>`)}function helper(){return shell('Grooming <span class="goldtext">Helper</span>','Gemini helper','Ask a quick grooming question in a cleaner chat style.',`<div class="chat-shell"><section class="chat-phone" aria-label="Barking Mad Helper chat"><div class="chat-head"><div class="avatar">BM</div><div><div class="chat-name">Barking Mad Helper</div><div class="chat-sub">Usually replies instantly</div></div></div><div class="chat-feed" id="chatFeed"><div class="msg-row bot"><div class="tiny-avatar">BM</div><div><div class="bubble">Hi! Tell me about your dog, coat, knots, size, or the service you are thinking about.</div><div class="msg-meta">Helper</div></div></div></div><form class="chat-composer" id="helperForm"><div class="chat-tools"><select name="dog_size"><option value="">Dog size</option><option>Tiny</option><option>Small</option><option>Medium</option><option>Large</option></select><input name="coat_type" placeholder="Coat type or condition"></div><div class="chat-send"><textarea name="question" required placeholder="Message Barking Mad Helper..."></textarea><button class="btn gold send-btn" type="submit" aria-label="Send">↑</button></div><div id="helperStatus" class="hidden"></div></form></section><aside class="card"><h3>Try asking</h3><div class="quick-grid"><button class="btn soft" onclick="quickAsk('My dog has knots. Should I book a full groom?')">Knots or matting</button><button class="btn soft" onclick="quickAsk('What service should I choose for a nervous small dog?')">Nervous dog</button><button class="btn soft" onclick="quickAsk('How much is a wash and dry for a medium dog?')">Price help</button><button class="btn soft" onclick="quickAsk('What should I tell you before booking?')">Before booking</button></div></aside></div>`)}
function contact(){return shell('Contact <span class="goldtext">Us</span>','Tawa, Wellington','Message to book, ask a question or confirm the best service.',`<div class="split"><form class="card form" id="contactForm"><h3>Message the team</h3><div class="row"><div class="field"><label>Name</label><input name="name" required></div><div class="field"><label>Phone</label><input name="phone"></div></div><div class="field"><label>Email</label><input name="email" type="email"></div><div class="field"><label>Message</label><textarea name="message" required></textarea></div><button class="btn gold" type="submit">Send message</button><div id="contactStatus"></div></form><div class="card"><h3>Contact</h3><p><a href="sms:${PHONE}">${PHONE}</a><br><a href="mailto:barkingmadbarbers@gmail.com">barkingmadbarbers@gmail.com</a><br>5A Tawa Street, Tawa</p></div></div>`)}function family(){return shell('Our <span class="goldtext">Family</span>','Loved like our own','Submit photos or requests for admin review.',`<div class="split"><form class="card form" id="galleryForm"><h3>Share your dog</h3><div class="row"><div class="field"><label>Your name</label><input name="owner_name"></div><div class="field"><label>Email</label><input name="email" type="email"></div></div><div class="field"><label>Dog name</label><input name="dog_name" required></div><div class="field"><label>Photo URL</label><input name="image_url" placeholder="Paste a photo link"></div><div class="field"><label>Caption</label><textarea name="caption"></textarea></div><button class="btn gold" type="submit">Submit photo</button><div id="galleryStatus"></div></form><form class="card form" id="requestForm"><h3>Send a request</h3><div class="row"><div class="field"><label>Name</label><input name="name" required></div><div class="field"><label>Email</label><input name="email" type="email"></div></div><div class="row"><div class="field"><label>Phone</label><input name="phone"></div><div class="field"><label>Request type</label><input name="request_type"></div></div><div class="field"><label>Message</label><textarea name="message" required></textarea></div><button class="btn dark" type="submit">Send request</button><div id="requestStatus"></div></form></div>`)}
function signin(){return shell('Sign in <span class="goldtext">once</span>','Google or email','Admin uses the same sign-in. Admin access only appears when the Gmail matches ADMIN_EMAILS.',`<div class="split"><form class="card form" id="signinForm"><div id="googleSignIn"></div><div class="divider">or</div><div class="field"><label>Name</label><input name="name" required></div><div class="field"><label>Email</label><input name="email" type="email" required></div><div class="field"><label>Password</label><input name="password" type="password" required></div><button class="btn gold" type="submit">Sign in / create account</button><div id="signinStatus"></div></form><div class="card"><h3>Current account</h3><div id="sessionBox"></div></div></div>`)}function sessionHtml(){const p=profile();return token()?`<div class="status good">Signed in as ${esc(p.email||'customer')} ${p.is_admin?'(admin)':''}</div><button class="btn soft" onclick="clearAuth();render()">Sign out</button>`:'<div class="status">Not signed in yet.</div>'}async function googleInit(){const box=$('#googleSignIn');if(!box)return;try{const cfg=await api('/api/auth/google/config');if(!cfg.enabled||!cfg.client_id){box.innerHTML='<div class="status">Google sign-in is not enabled yet.</div>';return}if(!window.google||!google.accounts?.id){setTimeout(googleInit,350);return}google.accounts.id.initialize({client_id:cfg.client_id,callback:async r=>{try{status('#signinStatus','Signing in with Google...');const d=await api('/api/auth/google',{method:'POST',body:JSON.stringify({id_token:r.credential})});await saveAuth(d);status('#signinStatus','Signed in with Google.','good');render()}catch(e){status('#signinStatus',esc(e.message),'bad')}}});box.innerHTML='';google.accounts.id.renderButton(box,{theme:'outline',size:'large',text:'continue_with',shape:'pill',width:300})}catch(e){box.innerHTML=`<div class="status bad">${esc(e.message)}</div>`}}
function admin(){return shell('Admin <span class="goldtext">Dashboard</span>','Staff only','Bookings, contacts, gallery submissions, requests, AI chats and users.',`<div class="split"><form class="card form" id="adminLoginForm"><h3>Admin sign-in</h3><div class="field"><label>Admin email</label><input name="email" type="email" required></div><div class="field"><label>Password</label><input name="password" type="password" required></div><button class="btn dark" type="submit">Admin login</button><div id="adminLoginStatus"></div></form><div class="card"><h3>Current admin</h3><div id="adminSession"></div><div class="actions"><button class="btn soft" onclick="loadAdminDashboard()">Refresh dashboard</button><button class="btn soft" onclick="clearAuth();render()">Sign out</button></div></div></div><div class="tabs"><button class="btn soft active" onclick="tab('bookings',this)">Bookings</button><button class="btn soft" onclick="tab('contacts',this)">Contacts</button><button class="btn soft" onclick="tab('gallery',this)">Gallery</button><button class="btn soft" onclick="tab('requests',this)">Requests</button><button class="btn soft" onclick="tab('chats',this)">AI chats</button><button class="btn soft" onclick="tab('users',this)">Users</button></div><div id="adminStatus"></div><div id="adminBookings" class="list panel"></div><div id="adminContacts" class="list panel hidden"></div><div id="adminGallery" class="list panel hidden"></div><div id="adminRequests" class="list panel hidden"></div><div id="adminChats" class="list panel hidden"></div><div id="adminUsers" class="list panel hidden"></div>`)}function tab(n,b){document.querySelectorAll('.panel').forEach(p=>p.classList.add('hidden'));({bookings:'adminBookings',contacts:'adminContacts',gallery:'adminGallery',requests:'adminRequests',chats:'adminChats',users:'adminUsers'}[n]&&$('#'+({bookings:'adminBookings',contacts:'adminContacts',gallery:'adminGallery',requests:'adminRequests',chats:'adminChats',users:'adminUsers'}[n])).classList.remove('hidden'));document.querySelectorAll('.tabs .btn').forEach(x=>x.classList.remove('active'));b?.classList.add('active')}function adminGuard(){if(!token()){status('#adminStatus','Admin login needed.');return false}return true}function adminError(e,id){if(authErr(e)){clearAuth();status('#adminStatus','Your admin session expired or is not admin. Please sign in again.');return}status(id,esc(e.message),'bad')}
async function loadAdminDashboard(){if(!adminGuard())return;await Promise.all([loadBookings(),loadContacts(),loadGallery(),loadRequests(),loadChats(),loadUsers()])}function item(top,body,actions=''){return `<article class="item"><div class="topline">${top}</div>${body}${actions?`<div class="actions">${actions}</div>`:''}</article>`}async function loadBookings(){const id='#adminBookings';try{const d=await api('/api/admin/bookings',{headers:headers()});$(id).innerHTML=(d.bookings||[]).length?d.bookings.map(b=>item(`<strong>${esc(b.dog_name||'Dog')} - ${esc(b.service||'Service')}</strong><span class="tag">${esc(b.status||'New')}</span>`,`<p>${esc(b.owner_name||'')} | ${esc(b.phone||'')} | ${esc(b.email||'')}</p><p>${esc(b.preferred_date||'')} ${esc(b.preferred_time||'')}</p><p>${esc(b.notes||'')}</p>`,`<select onchange="updateBooking('${esc(b.id)}',this.value)"><option>${esc(b.status||'New')}</option><option>New</option><option>Contacted</option><option>Confirmed</option><option>Completed</option><option>Cancelled</option></select><button class="btn soft" onclick="deleteBooking('${esc(b.id)}')">Delete</button>`)).join(''):'<div class="status">No bookings yet.</div>'}catch(e){adminError(e,id)}}async function updateBooking(id,statusValue){try{await api('/api/admin/bookings/'+id,{method:'PATCH',headers:headers(),body:JSON.stringify({status:statusValue})});loadBookings()}catch(e){adminError(e,'#adminBookings')}}async function deleteBooking(id){if(!confirm('Delete this booking?'))return;try{await api('/api/admin/bookings/'+id,{method:'DELETE',headers:headers()});loadBookings()}catch(e){adminError(e,'#adminBookings')}}
async function loadContacts(){const id='#adminContacts';try{const d=await api('/api/admin/contacts',{headers:headers()});$(id).innerHTML=(d.contacts||[]).length?d.contacts.map(c=>item(`<strong>${esc(c.name)}</strong><span class="tag">${c.is_read?'Read':'New'}</span>`,`<p>${esc(c.phone||'')} | ${esc(c.email||'')}</p><p>${esc(c.message||'')}</p>`,`<button class="btn soft" onclick="readContact('${esc(c.id)}')">Mark read</button><button class="btn soft" onclick="del('/api/admin/contacts/${esc(c.id)}',loadContacts)">Delete</button>`)).join(''):'<div class="status">No contact messages yet.</div>'}catch(e){adminError(e,id)}}async function readContact(id){try{await api('/api/admin/contacts/'+id+'/read',{method:'PUT',headers:headers()});loadContacts()}catch(e){adminError(e,'#adminContacts')}}async function loadGallery(){const id='#adminGallery';try{const d=await api('/api/admin/gallery',{headers:headers()});$(id).innerHTML=(d.photos||[]).length?d.photos.map(p=>item(`<strong>${esc(p.dog_name)}</strong><span class="tag">${esc(p.status)}</span>`,`<p>${esc(p.owner_name||'')} | ${esc(p.email||'')}</p>${p.image_url?`<p><a href="${esc(p.image_url)}" target="_blank" rel="noopener">Open photo</a></p>`:''}<p>${esc(p.caption||'')}</p>`,`<button class="btn soft" onclick="put('/api/admin/gallery/${esc(p.id)}/approve',loadGallery)">Approve</button><button class="btn soft" onclick="put('/api/admin/gallery/${esc(p.id)}/reject',loadGallery)">Reject</button><button class="btn soft" onclick="del('/api/admin/gallery/${esc(p.id)}',loadGallery)">Delete</button>`)).join(''):'<div class="status">No gallery submissions yet.</div>'}catch(e){adminError(e,id)}}async function loadRequests(){const id='#adminRequests';try{const d=await api('/api/admin/requests',{headers:headers()});$(id).innerHTML=(d.requests||[]).length?d.requests.map(r=>item(`<strong>${esc(r.name)}</strong><span class="tag">${esc(r.status)}</span>`,`<p>${esc(r.phone||'')} | ${esc(r.email||'')} | ${esc(r.request_type||'Request')}</p><p>${esc(r.message||'')}</p>`,`<button class="btn soft" onclick="put('/api/admin/requests/${esc(r.id)}/approve',loadRequests)">Approve</button><button class="btn soft" onclick="put('/api/admin/requests/${esc(r.id)}/reject',loadRequests)">Reject</button><button class="btn soft" onclick="del('/api/admin/requests/${esc(r.id)}',loadRequests)">Delete</button>`)).join(''):'<div class="status">No requests yet.</div>'}catch(e){adminError(e,id)}}async function loadChats(){const id='#adminChats';try{const d=await api('/api/admin/chat-stats',{headers:headers()});const logs=d.recent||d.logs||[];$(id).innerHTML=`<div class="status">Total chats: ${esc(d.total_chats||0)}</div>`+(logs.length?logs.map(l=>item(`<strong>${esc(l.provider||'AI')} ${esc(l.model||'')}</strong><span class="tag">${esc(l.created_at||'')}</span>`,`<p><strong>User:</strong> ${esc(l.message||'')}</p><p><strong>Reply:</strong> ${esc(l.reply||'')}</p>`)).join(''):'<div class="status">No AI chats yet.</div>')}catch(e){adminError(e,id)}}async function loadUsers(){const id='#adminUsers';try{const d=await api('/api/admin/users',{headers:headers()});$(id).innerHTML=(d.users||[]).length?d.users.map(u=>item(`<strong>${esc(u.name||'User')}</strong><span class="tag">${u.is_admin?'Admin':'User'}</span>`,`<p>${esc(u.email||'')}</p><p>Created: ${esc(u.created_at||'')}</p>`)).join(''):'<div class="status">No users yet.</div>'}catch(e){adminError(e,id)}}async function put(path,cb){try{await api(path,{method:'PUT',headers:headers()});cb()}catch(e){status('#adminStatus',esc(e.message),'bad')}}async function del(path,cb){if(!confirm('Delete this?'))return;try{await api(path,{method:'DELETE',headers:headers()});cb()}catch(e){status('#adminStatus',esc(e.message),'bad')}}
function appendMsg(who,text,typing=false){const feed=$('#chatFeed');if(!feed)return;const row=document.createElement('div');row.className='msg-row '+(who==='you'?'you':'bot')+(typing?' typing':'');row.innerHTML=who==='you'?`<div><div class="bubble">${esc(text)}</div><div class="msg-meta">You</div></div>`:`<div class="tiny-avatar">BM</div><div><div class="bubble">${typing?'<span class="typing-dots"><i></i><i></i><i></i></span>':esc(text)}</div><div class="msg-meta">Helper</div></div>`;feed.appendChild(row);feed.scrollTop=feed.scrollHeight;return row}function quickAsk(text){const q=document.querySelector('#helperForm textarea[name="question"]');if(q){q.value=text;q.focus()}}async function submitHelper(e){e.preventDefault();const form=e.currentTarget,d=fd(form),text=(d.question||'').trim();if(!text)return;appendMsg('you',text);const typing=appendMsg('bot','',true);form.question.value='';try{const r=await api('/api/chat',{method:'POST',headers:headers(),body:JSON.stringify({message:[text,d.dog_size,d.coat_type].filter(Boolean).join('\n')})});typing.remove();appendMsg('bot',r.reply||r.answer||'Done.')}catch(err){typing.remove();appendMsg('bot','Sorry, I could not reach the helper just now. Please try again or text 027 247 2493.')}}
function bind(){const b=$('#bookingForm');if(b){$('#addDog').onclick=()=>{$('#dogs').insertAdjacentHTML('beforeend',dogBox(document.querySelectorAll('.dogbox').length+1));refreshDogs()};refreshDogs();b.onsubmit=async e=>{e.preventDefault();const d=fd(b),box=document.querySelector('.dogbox'),g=n=>box.querySelector(`[name="${n}"]`)?.value||'',payload={owner_name:d.owner_name,phone:d.phone,email:d.email,dog_name:g('dog_name'),dog_size:g('dog_size'),service:g('service'),preferred_date:d.preferred_date,preferred_time:d.preferred_time,notes:[d.notes,dogSummary()].filter(Boolean).join('\n')};status('#bookingStatus','Sending booking request...');try{await api('/api/bookings',{method:'POST',headers:headers(),body:JSON.stringify(payload)});b.reset();status('#bookingStatus','Booking request sent. Barking Mad Barbers can confirm the details soon.','good')}catch(err){status('#bookingStatus','The online booking server is unavailable, so we are opening a text message with your enquiry ready to send.','good');setTimeout(()=>location.href=smsUrl(d),600)}}}const h=$('#helperForm');if(h)h.onsubmit=submitHelper;const c=$('#contactForm');if(c)c.onsubmit=async e=>{e.preventDefault();status('#contactStatus','Sending message...');try{await api('/api/contact',{method:'POST',body:JSON.stringify(fd(c))});c.reset();status('#contactStatus','Message sent to the admin dashboard.','good')}catch(err){status('#contactStatus',esc(err.message),'bad')}};const g=$('#galleryForm');if(g){const p=profile();if(p.email){g.owner_name.value=p.name||'';g.email.value=p.email||''}g.onsubmit=async e=>{e.preventDefault();status('#galleryStatus','Submitting photo...');try{await api('/api/gallery/submit',{method:'POST',headers:headers(),body:JSON.stringify(fd(g))});g.reset();status('#galleryStatus','Photo submitted for admin approval.','good')}catch(err){status('#galleryStatus',esc(err.message),'bad')}}}const r=$('#requestForm');if(r){const p=profile();if(p.email){r.name.value=p.name||'';r.email.value=p.email||''}r.onsubmit=async e=>{e.preventDefault();status('#requestStatus','Sending request...');try{await api('/api/requests',{method:'POST',headers:headers(),body:JSON.stringify(fd(r))});r.reset();status('#requestStatus','Request sent to the admin dashboard.','good')}catch(err){status('#requestStatus',esc(err.message),'bad')}}}const s=$('#signinForm');if(s){$('#sessionBox').innerHTML=sessionHtml();googleInit();s.onsubmit=async e=>{e.preventDefault();const d=fd(s);status('#signinStatus','Signing in...');try{let out;try{out=await api('/api/auth/register',{method:'POST',body:JSON.stringify({name:d.name,email:d.email,password:d.password})})}catch{out=await api('/api/auth/login',{method:'POST',body:JSON.stringify({email:d.email,password:d.password})})}await saveAuth(out);status('#signinStatus','Signed in.','good');render()}catch(err){status('#signinStatus',esc(err.message),'bad')}}}const a=$('#adminLoginForm');if(a){$('#adminSession').innerHTML=sessionHtml();a.onsubmit=async e=>{e.preventDefault();const d=fd(a);status('#adminLoginStatus','Signing in...');try{const out=await api('/api/auth/login',{method:'POST',body:JSON.stringify(d)});if(!out.user?.is_admin)throw new Error('That account is not an admin.');await saveAuth(out);status('#adminLoginStatus','Admin signed in.','good');$('#adminSession').innerHTML=sessionHtml();loadAdminDashboard()}catch(err){status('#adminLoginStatus',esc(err.message),'bad')}};loadAdminDashboard()}}
function render(){nav();const views={home:hero,services,sanctuary,'our-family':family,team,book,helper,contact,'sign-in':signin,admin};$('#app').innerHTML=(views[key()]||hero)();links();bind();scrollTo(0,0)}addEventListener('popstate',render);render();
