    .team-grid{display:grid; grid-template-columns:1.04fr .96fr; gap:18px; align-items:stretch}.team-photo{min-height:570px; overflow:hidden; border-radius:44px; box-shadow:var(--shadow); position:relative; background:#fff}.team-photo img{width:100%; height:100%; object-fit:cover}.team-photo::after{content:""; position:absolute; inset:0; background:linear-gradient(to top, rgba(23,19,13,.46), transparent 56%)}.team-photo .caption{position:absolute; left:26px; right:26px; bottom:24px; z-index:2; color:#fff}.team-photo h3{font-size:2rem; line-height:.95; letter-spacing:-.04em; margin:0 0 7px}.team-photo p{margin:0; line-height:1.45; font-weight:700}.team-side{display:grid; gap:18px}.team-side .team-photo{min-height:276px}.family-band{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-top:18px}
    .form-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px}.field{display:grid; gap:7px}.field.full{grid-column:1/-1}.field label{font-size:.82rem; text-transform:uppercase; letter-spacing:.075em; font-weight:950; color:var(--muted)}.field input,.field select,.field textarea{width:100%; border:0; outline:none; border-radius:20px; background:rgba(255,253,248,.86); box-shadow:inset 0 0 0 1px rgba(180,137,63,.13); padding:15px 16px; color:var(--ink)}.field textarea{min-height:120px; resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{box-shadow:0 0 0 4px rgba(180,137,63,.16), inset 0 0 0 1px var(--gold)}.message{display:none; margin-top:14px; padding:14px 16px; border-radius:18px; font-weight:850}.message.show{display:block}.message.good{background:rgba(63,116,87,.12); color:var(--green)}.message.bad{background:rgba(152,73,62,.12); color:var(--red)}.two-col{display:grid; grid-template-columns:.88fr 1.12fr; gap:24px; align-items:start}.sticky-copy{position:sticky; top:110px}.mini-logo{width:260px; padding:14px 18px; border-radius:28px; background:rgba(255,255,255,.55); box-shadow:var(--softshadow); margin-bottom:20px}.form-card{border-radius:42px; padding:28px; background:rgba(255,255,255,.50); box-shadow:var(--shadow)}

    @media(max-width:1000px){.hero-grid,.two-col,.team-grid{grid-template-columns:1fr}.hero-art{min-height:600px}.section-head{display:block}.section-head p{margin-top:14px}.icon-grid{grid-template-columns:repeat(2,1fr)}.price-grid,.split,.contact-grid{grid-template-columns:1fr}.sticky-copy{position:static}.team-photo{min-height:460px}.family-band{grid-template-columns:1fr}.price-image{max-width:700px;margin:auto}}
    @media(max-width:760px){.wrap{width:min(100% - 28px, var(--max))}.nav{height:74px}.brand img{width:62px}.brand strong{font-size:.8rem}.brand span{font-size:.74rem}.menu{display:block}.navlinks{display:none; position:absolute; left:0; right:0; top:78px; padding:13px; border-radius:26px; background:rgba(255,250,241,.96); box-shadow:var(--shadow); justify-content:flex-start}.navlinks.open{display:flex}.navlinks a,.navlinks button{width:100%; text-align:left; justify-content:flex-start}.hero{padding-top:34px}.hero h1,.route-hero h1{font-size:clamp(3rem,16vw,5.4rem)}.hero-art{min-height:520px}.logo-card{width:86vw}.photo.one{width:59%; bottom:0}.photo.two{width:62%; top:120px}.stats,.icon-grid,.sizes,.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.service-title{display:block}.service-title span{display:block; margin-top:6px}.form-card,.canvas-panel{padding:22px; border-radius:32px}.booking-card dl{grid-template-columns:1fr}.team-photo,.team-side .team-photo{min-height:360px}.actions .btn{width:100%}}
  </style>

<body>
  <canvas id="canvasWash" aria-hidden="true"></canvas>
  <a class="skip" href="#app">Skip to content</a>
  <header class="topbar">
    <div class="wrap nav">
      <a class="brand" href="/" data-route>
        <img src="/assets/logo.png" alt="Barking Mad Barbers logo" />
        <span><strong>Barking Mad Barbers</strong><span>Tawa dog grooming</span></span>
      </a>
      <button class="menu" id="menuBtn" type="button">Menu</button>
      <nav class="navlinks" id="navLinks" aria-label="Main navigation">
        <a href="/services" data-route>Services</a>
        <a href="/Sanctuary" data-route>Sanctuary</a>
        <a href="/our-family" data-route>Our Family</a>
        <a href="/team" data-route>Team</a>
        <a href="/helper" data-route>Helper</a>
        <a href="/contact" data-route>Contact</a>
        <a href="/sign-in" data-route>Sign in</a>
        <a class="book-now" href="/book" data-route>Book</a>
      </nav>
    </div>
  </header>

  <main id="app" class="route-shell" tabindex="-1"></main>

  <footer class="footer">
    <div class="wrap footer-grid">
      <img src="/assets/logo.png" alt="Barking Mad Barbers logo" />
      <div>
        <strong>Barking Mad Barbers</strong><br />
        <span>Premium one-on-one dog grooming in Tawa, Wellington.</span>
      </div>
      <div class="footer-links">
        <a href="/services" data-route>Services</a>
        <a href="/book" data-route>Book</a>
        <a href="/admin" data-route>Admin</a>
      </div>
    </div>
  </footer>

  <script>
    const $ = (selector, root=document) => root.querySelector(selector);
    const $$ = (selector, root=document) => Array.from(root.querySelectorAll(selector));
    const USER_TOKEN_KEY = 'bmb_user_token_v2';
    const USER_PROFILE_KEY = 'bmb_user_profile_v2';
    const ADMIN_TOKEN_KEY = 'bmb_admin_token_v2';
    const ADMIN_EMAIL_KEY = 'bmb_admin_email_v2';

    const iconPaths = {
      scissors:'<path d="M5 5l14 14M19 5L5 19"/><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/>',
      bath:'<path d="M5 13h14v2a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5v-2h1z"/><path d="M7 13V8a3 3 0 0 1 3-3h1"/><path d="M14 5h3v3"/><path d="M8 20l-1 2M17 20l1 2"/>',
      paw:'<circle cx="7" cy="8" r="2"/><circle cx="12" cy="6" r="2"/><circle cx="17" cy="8" r="2"/><circle cx="9" cy="13" r="2"/><circle cx="15" cy="13" r="2"/><path d="M8 18c1-3 7-3 8 0 .5 1.6-.7 3-2.4 2.4a5 5 0 0 0-3.2 0C8.7 21 7.5 19.6 8 18z"/>',
      shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6l8-3z"/><path d="M9 12l2 2 4-5"/>',
      heart:'<path d="M20.8 8.6c0 5.4-8.8 10.4-8.8 10.4S3.2 14 3.2 8.6A4.6 4.6 0 0 1 12 6a4.6 4.6 0 0 1 8.8 2.6z"/>',
      calendar:'<rect x="4" y="5" width="16" height="16" rx="3"/><path d="M8 3v4M16 3v4M4 10h16"/><path d="M8 14h3M13 14h3M8 18h3"/>',
      user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1.6-4 14.4-4 16 0"/>',
      home:'<path d="M4 11l8-7 8 7"/><path d="M6 10v10h12V10"/><path d="M10 20v-6h4v6"/>',
      spark:'<path d="M12 2l1.6 6.4L20 10l-6.4 1.6L12 18l-1.6-6.4L4 10l6.4-1.6L12 2z"/><path d="M19 16l.8 3.2L23 20l-3.2.8L19 24l-.8-3.2L15 20l3.2-.8L19 16z"/>',
      message:'<path d="M4 5h16v11H8l-4 4V5z"/><path d="M8 9h8M8 13h5"/>',
      lock:'<rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/><path d="M12 15v2"/>',
      phone:'<path d="M8 3h8l1 4-3 2a14 14 0 0 0 5 5l2-3 4 1v8a2 2 0 0 1-2 2C12 22 2 12 2 5a2 2 0 0 1 2-2h4z"/>',
      check:'<path d="M20 6L9 17l-5-5"/>',
      map:'<path d="M9 18l-6 3V6l6-3 6 3 6-3v15l-6 3-6-3z"/><path d="M9 3v15M15 6v15"/>'
    };
    function icon(name, cls=''){return `<span class="sq ${cls}"><svg viewBox="0 0 24 24" aria-hidden="true">${iconPaths[name]}</svg></span>`}
    function tick(){return `<svg class="tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>`}
    function routeName(path=location.pathname){
      if(path === '/') return '/';
      const clean = path.replace(/\/$/,'');
      if(clean.toLowerCase() === '/sanctuary') return '/Sanctuary';
      return clean;
    }
    function userProfile(){try{return JSON.parse(localStorage.getItem(USER_PROFILE_KEY)||'null')}catch{return null}}
    function authHeaders(kind='user'){
      const token = localStorage.getItem(kind === 'admin' ? ADMIN_TOKEN_KEY : USER_TOKEN_KEY);
      return token ? {'Authorization': `Bearer ${token}`} : {};
    }
    async function api(path, options={}){
      const res = await fetch(path, {headers:{'Content-Type':'application/json', ...(options.headers||{})}, ...options});
      let data = null;
      try{data = await res.json()}catch{data = {detail: await res.text()}}
      if(!res.ok) throw new Error(data.detail || data.message || 'Request failed');
      return data;
    }

    const serviceItems = ['Warm Bath - Shampoo & Condition','Blow Dry','Brush out','Nail Trim','Anal Gland Expression'];
    const fullItems = ['Warm Bath - Shampoo & Condition','Blow Dry','Brush out','Full Body Clip','Scissor-Finish - Face & Feet','Nail Trim','Ear Cleaning','Anal Gland Expression'];
    const extras = [['Flea Shampoo','$20'],['Nail Trim','$20'],['Teeth Brush','$10'],['Face Tidy','$10'],['Anal Gland Expression','$20']];

    function heroHome(){return `
      <div class="hero">
        <div class="wrap hero-grid">
          <div>
            <div class="eyebrow"><span class="dot"></span> Premium one-on-one grooming</div>
            <h1>Clean coats. Calm dogs. <span>Happy tails.</span></h1>

    function notFound(){return `${routeHero('Page not found','That page does not exist yet. Use the menu to jump back into Barking Mad Barbers.','404')}<section><div class="wrap actions"><a class="btn primary" href="/" data-route>Home</a><a class="btn light" href="/book" data-route>Book</a></div></section>`}

    const routes = {'/':heroHome,'/services':servicesPage,'/Sanctuary':sanctuaryPage,'/our-family':familyPage,'/team':teamPage,'/book':bookPage,'/helper':helperPage,'/contact':contactPage,'/sign-in':signInPage,'/admin':adminPage};
    function escapeHtml(value){return String(value||'').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
    function navigate(path, replace=false){const clean=routeName(path); if(replace) history.replaceState({},'',clean); else history.pushState({},'',clean); render();}
    function render(){
      const path = routeName();
      const view = routes[path] || notFound;
      $('#app').innerHTML = view();
      $$('.navlinks a').forEach(a => a.classList.toggle('active', routeName(a.getAttribute('href')) === path));
      $('#navLinks').classList.remove('open');
      document.title = path === '/' ? 'Barking Mad Barbers | Tawa Dog Grooming' : `${document.querySelector('.route-hero h1')?.textContent || 'Barking Mad Barbers'} | Barking Mad Barbers`;
      requestAnimationFrame(() => $('#app').focus({preventScroll:true}));
      afterRender(path);
    }

    function afterRender(path){
      if(path === '/book') setupBooking();
      if(path === '/helper') setupHelper();
      if(path === '/sign-in') setupUserSignIn();
      if(path === '/admin') setupAdmin();
      if(path === '/our-family') loadMine();
    }

    function setupBooking(){
      const form = $('#bookingForm'); const msg = $('#bookingMsg'); if(!form) return;
      form.addEventListener('submit', async e => {
        e.preventDefault(); msg.className = 'message show'; msg.textContent = 'Sending request...';
        const body = Object.fromEntries(new FormData(form).entries());
        try{ await api('/api/bookings', {method:'POST', headers:authHeaders('user'), body:JSON.stringify(body)}); msg.className='message show good'; msg.textContent='Booking request sent. The team can now review it.'; form.reset(); }
        catch(err){ msg.className='message show bad'; msg.textContent=err.message; }
      });
    }
    function setupHelper(){
      const form = $('#helperForm'); const msg = $('#helperMsg'); if(!form) return;
      form.addEventListener('submit', async e => {
        e.preventDefault(); msg.className='message show'; msg.textContent='Thinking...';
        try{ const data = await api('/api/helper', {method:'POST', body:JSON.stringify({question:$('#helperQuestion').value, dog_size:$('#helperSize').value, coat_type:$('#helperCoat').value})}); msg.className='message show good'; msg.textContent=data.answer; }
        catch(err){ msg.className='message show bad'; msg.textContent=err.message; }
      });
    }
    function setupUserSignIn(){
      const form = $('#userSignForm'); const msg = $('#signMsg'); const out = $('#signOutBtn'); if(!form) return;
      form.addEventListener('submit', async e => {
        e.preventDefault(); msg.className='message show'; msg.textContent='Signing in...';
        const body = {name:$('#userName').value, email:$('#userEmail').value, phone:$('#userPhone').value, dog_name:$('#userDog').value};
        try{ const data = await api('/api/user/sign-in', {method:'POST', body:JSON.stringify(body)}); localStorage.setItem(USER_TOKEN_KEY, data.token); localStorage.setItem(USER_PROFILE_KEY, JSON.stringify(data.profile)); msg.className='message show good'; msg.textContent=`Signed in as ${data.profile.name}.`; out.style.display='inline-flex'; }
        catch(err){ msg.className='message show bad'; msg.textContent=err.message; }
      });
      out?.addEventListener('click', () => {localStorage.removeItem(USER_TOKEN_KEY); localStorage.removeItem(USER_PROFILE_KEY); render();});
    }
    function setupAdmin(){
      const form = $('#adminLoginForm'); const dash = $('#adminDash'); const msg = $('#adminMsg');
      async function showDash(){form.style.display='none'; dash.style.display='block'; await loadAdminBookings();}
      if(localStorage.getItem(ADMIN_TOKEN_KEY)) showDash().catch(()=>{localStorage.removeItem(ADMIN_TOKEN_KEY);});
      form?.addEventListener('submit', async e => {
        e.preventDefault(); msg.className='message show'; msg.textContent='Opening dashboard...';

        catch(err){ msg.className='message show bad'; msg.textContent=err.message; }

      catch(err){ list.innerHTML = `<div class="message show bad">${escapeHtml(err.message)}</div>`; }
    }
    function renderBookings(bookings, admin=false){
      if(!bookings.length) return '<div class="message show good">No booking requests yet.</div>';
      return bookings.map(b => `<article class="booking-card" data-id="${escapeHtml(b.id)}"><header><div><h4>${escapeHtml(b.dog_name)} — ${escapeHtml(b.service)}</h4><small>${escapeHtml(b.owner_name)} · ${escapeHtml(b.created_at || '').slice(0,10)}</small></div><span class="pill">${escapeHtml(b.status || 'New')}</span></header><dl><dt>Phone</dt><dd>${escapeHtml(b.phone)}</dd><dt>Email</dt><dd>${escapeHtml(b.email || '—')}</dd><dt>Size</dt><dd>${escapeHtml(b.dog_size)}</dd><dt>Preferred</dt><dd>${escapeHtml([b.preferred_date,b.preferred_time].filter(Boolean).join(' · ') || '—')}</dd><dt>Notes</dt><dd>${escapeHtml(b.notes || '—')}</dd>${b.staff_notes?`<dt>Staff</dt><dd>${escapeHtml(b.staff_notes)}</dd>`:''}</dl>${admin?`<div class="booking-actions"><button class="mini-btn" data-status="Contacted">Mark contacted</button><button class="mini-btn" data-status="Confirmed">Confirm</button><button class="mini-btn" data-status="Done">Done</button><button class="mini-btn" data-delete="1">Delete</button></div>`:''}</article>`).join('');

    function bindBookingActions(){
      $$('#bookingList .mini-btn').forEach(btn => btn.addEventListener('click', async e => {

        catch(err){ alert(err.message); }
      }));
    }

      mount.innerHTML = '<div class="message show">Loading your booking requests...</div>';
      try{ const data = await api('/api/bookings/mine', {headers:authHeaders('user')}); mount.innerHTML = `<div class="section-head"><h2>Your bookings.</h2><p>Here are the booking requests connected to your email.</p></div><div class="booking-list">${renderBookings(data.bookings,false)}</div>`; }

    function canvasWash(){
      const canvas = $('#canvasWash'), ctx = canvas.getContext('2d'); let w,h,dpr,spots=[];
      function resize(){dpr=Math.min(devicePixelRatio||1,2); w=canvas.width=innerWidth*dpr; h=canvas.height=innerHeight*dpr; canvas.style.width=innerWidth+'px'; canvas.style.height=innerHeight+'px'; spots=Array.from({length:38},()=>({x:Math.random()*w,y:Math.random()*h,r:(Math.random()*3+1)*dpr,v:(Math.random()*.22+.05)*dpr,a:Math.random()*Math.PI*2}));}
      function draw(){ctx.clearRect(0,0,w,h); ctx.fillStyle='rgba(180,137,63,.16)'; for(const s of spots){s.y-=s.v; s.x+=Math.sin(s.a+=.012)*.12*dpr; if(s.y<-12*dpr){s.y=h+12*dpr; s.x=Math.random()*w} ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill()} requestAnimationFrame(draw)}
      addEventListener('resize', resize, {passive:true}); resize(); draw();
    }
    canvasWash();
    render();
  </script>
</body>
