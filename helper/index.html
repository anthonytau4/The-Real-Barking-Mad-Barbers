<!doctype html>
<meta charset="utf-8">
<title>Barking Mad Barbers</title>
<script>
  const routePath = '/helper';
  const apiBase = (localStorage.getItem('bmb_api_base_url') || '').replace(/\/+$/, '');
  const nativeFetch = window.fetch.bind(window);
  window.fetch = (input, init) => {
    const url = typeof input === 'string' ? input : (input && input.url) || '';
    const isApi = url.startsWith('/api/') || /\/api\//.test(url);
    if (apiBase && typeof input === 'string' && input.startsWith('/api/')) input = apiBase + input;
    if (isApi && init && typeof init.body === 'string' && /^[\s\r\n]*[\[{]/.test(init.body)) {
      init = { ...init, headers: { 'Content-Type': 'application/json', ...(init.headers || {}) } };
    }
    return nativeFetch(input, init);
  };
  history.replaceState(null, '', routePath);
  nativeFetch('/index.html', { cache: 'no-store' })
    .then(response => response.text())
    .then(html => { document.open(); document.write(html); document.close(); });
</script>
