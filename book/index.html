<!doctype html>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Barking Mad Barbers</title>
<script>
(() => {
  const routePath = '/book';
  const apiBase = (localStorage.getItem('bmb_api_base_url') || '').replace(/\/+$/, '');
  const nativeFetch = window.fetch.bind(window);
  const setStatus = (el, msg, kind = '') => { if (el) el.innerHTML = `<div class="status ${kind}">${msg}</div>`; };
  const readFormData = form => Object.fromEntries(new FormData(form).entries());

  function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]));
  }

  function installStyle() {
    if (document.getElementById('bmb-book-fallback-style')) return;
    const style = document.createElement('style');
    style.id = 'bmb-book-fallback-style';
    style.textContent = `body{background:linear-gradient(180deg,#fff 0%,#fffdf8 30%,#f7efe1 100%)!important}.nav{background:transparent!important;border:0!important;padding:12px 14px 0!important}.nav-inner{background:#080806!important;border:1px solid rgba(216,179,106,.42)!important;border-radius:999px!important;box-shadow:0 18px 44px rgba(18,16,11,.24)!important}.brand,.brand-title,.nav-link{color:#fff!important}.brand-sub{color:#d8b36a!important}.brand img{width:74px!important;height:46px!important;object-fit:contain!important;background:#fff!important;padding:3px!important}.nav-link:hover,.nav-link.active{background:linear-gradient(135deg,#b48731,#ead188)!important;color:#14110d!important}.btn-gold{background:linear-gradient(135deg,#a77a24,#ead188)!important;color:#14110d!important}#bookingForm{background:#fff!important;border:1px solid rgba(183,131,42,.24)!important;border-radius:30px!important;box-shadow:0 28px 70px rgba(18,16,11,.13)!important;overflow:hidden!important;padding:0!important;gap:0!important}.booking-live-head{background:#0a0907;color:#fff;padding:24px 26px;border-bottom:4px solid #c69b49;display:flex;justify-content:space-between;gap:16px;align-items:center}.booking-live-head h3{color:#fff;margin:0;font-size:30px}.booking-live-head p{margin:6px 0 0;color:#e6d9c3;font-weight:700}.booking-live-body{display:grid;gap:15px;padding:24px 26px 26px}.booking-live-layout{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(320px,.9fr);gap:22px;align-items:start}.booking-live-side{display:grid;gap:16px}.sms-notice{background:linear-gradient(135deg,#d5b464,#9c782e);border-radius:26px;padding:22px;color:#100f0b;box-shadow:0 18px 38px rgba(156,120,46,.24)}.sms-notice h3{font-size:28px;margin:0 0 10px}.sms-notice p{color:#18140c;font-weight:760;line-height:1.6}.dog-entry,.dog-card{border:1px solid rgba(183,131,42,.30)!important;background:linear-gradient(180deg,#fffdf8,#fff8ed)!important;border-radius:24px!important;overflow:hidden!important;box-shadow:0 14px 30px rgba(18,16,11,.07)!important}.dog-entry-head,.dog-panel-head{background:#17140f!important;color:#fff!important;padding:13px 16px!important}.dog-entry-title{color:#fff!important}.dog-entry-fields,.dog-list{padding:16px!important}.dog-enquiry-panel{border:1px solid rgba(183,131,42,.30);border-radius:24px;background:#fff8ed;overflow:hidden}.dog-panel-title strong{color:#fff}.dog-panel-title span{display:block;color:#e6d9c3;font-weight:650;margin-top:4px}.dog-card{padding:14px!important;display:grid;gap:12px}.dog-card-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.add-dog-btn,.remove-dog-btn{border:0;cursor:pointer;border-radius:999px;font-weight:950;display:inline-flex;align-items:center;justify-content:center;gap:8px}.add-dog-btn{padding:12px 16px;background:#17140f;color:#fff}.remove-dog-btn{padding:8px 12px;background:#fff5f3;color:#8d2a24}.add-dog-btn.full{width:100%;padding:16px;border-radius:22px;border:1px dashed rgba(183,131,42,.5);background:#fffaf2;color:#17140f}.sms-open-card .hero-actions{margin:12px 0 0}.sms-consent{display:flex;align-items:flex-start;gap:12px;border:1px solid rgba(183,131,42,.25);background:#fffaf2;border-radius:18px;padding:14px 16px;color:#40372d;font-weight:800;line-height:1.45}.sms-consent input{width:20px;height:20px;margin:1px 0 0;accent-color:#b7832a;flex:0 0 auto;box-shadow:none}.sms-preview{width:100%;min-height:180px;margin-top:12px;border-radius:16px;background:#fff;border:1px solid rgba(183,131,42,.28);color:#17140f;font-weight:700;line-height:1.5}@media(max-width:980px){.booking-live-layout{grid-template-columns:1fr}.nav-inner{border-radius:28px!important}}@media(max-width:620px){.dog-card-grid{grid-template-columns:1fr}.brand-title,.brand-sub{display:none!important}.brand{min-width:auto!important}.brand img{width:68px!important}.booking-live-head{display:block}.booking-live-body{padding:18px}.sms-notice{padding:18px}}`;
    document.head.appendChild(style);
  }

  function wrapBookingForm(form) {
    if (form.dataset.referenceWrapped) return;
    form.dataset.referenceWrapped = 'true';
    const children = [...form.childNodes];
    const head = document.createElement('div');
    head.className = 'booking-live-head';
    head.innerHTML = '<div><h3>Booking request</h3><p>Add every dog so the team can plan the right appointment time.</p></div><span class="tag goldtag">Text friendly</span>';
    const body = document.createElement('div');
    body.className = 'booking-live-body';
    children.forEach(child => body.appendChild(child));
    form.append(head, body);
    const split = form.closest('.split');
    if (split) split.className = 'booking-live-layout';
    const side = form.nextElementSibling;
    if (side) {
      side.classList.add('booking-live-side');
      side.querySelectorAll('.sms-notice').forEach(node => node.remove());
      const notice = document.createElement('div');
      notice.className = 'sms-notice';
      notice.innerHTML = '<h3>Texting works best</h3><p>Booking requests open your text app with the message ready to send. Please check the message, then send it through.</p><a class="btn btn-dark" id="textToBookBtn" href="sms:+64272472493">Text to Book</a>';
      side.prepend(notice);
    }
  }

  function ensureConsent(form) {
    if (form.querySelector('[name="booking_sms_consent"]')) return;
    const submit = form.querySelector('[type="submit"]');
    const consent = document.createElement('label');
    consent.className = 'sms-consent';
    consent.innerHTML = '<input name="booking_sms_consent" type="checkbox" required><span>I understand this enquiry will open as a text message to Barking Mad Barbers.</span>';
    submit?.before(consent);
  }

  function ensureFirstBreedField(form) {
    if (form.querySelector('[name="breed"]')) return;
    const sizeField = form.dog_size?.closest('.field');
    if (!sizeField) return;
    const breedField = document.createElement('div');
    breedField.className = 'field';
    breedField.innerHTML = '<label>Breed</label><input name="breed" required placeholder="Staffie, Pitbull, Cavoodle...">';
    sizeField.after(breedField);
  }

  function collectDogs(form) {
    const cards = [...form.querySelectorAll('.dog-entry')];
    if (cards.length) return cards.map(card => ({name: card.querySelector('[name="dog_name"]')?.value.trim() || '', size: card.querySelector('[name="dog_size"]')?.value.trim() || '', breed: card.querySelector('[name="breed"]')?.value.trim() || '', service: card.querySelector('[name="service"]')?.value.trim() || ''})).filter(dog => dog.name || dog.size || dog.breed || dog.service);
    const firstDog = { name: form.dog_name?.value.trim() || '', size: form.dog_size?.value.trim() || '', breed: form.breed?.value.trim() || '', service: form.service?.value.trim() || '' };
    const extras = [...form.querySelectorAll('[data-extra-dog]')].map(card => ({name: card.querySelector('[data-dog-name]')?.value.trim() || '', size: card.querySelector('[data-dog-size]')?.value.trim() || '', breed: card.querySelector('[data-dog-breed]')?.value.trim() || '', service: card.querySelector('[data-dog-service]')?.value.trim() || ''})).filter(dog => dog.name || dog.size || dog.breed || dog.service);
    return [firstDog, ...extras].filter(dog => dog.name || dog.size || dog.breed || dog.service);
  }

  function dogSummary(dog) { return `${[dog.size, dog.breed].filter(Boolean).join(' ') || dog.name || 'Dog'}${dog.name ? ` (${dog.name})` : ''}${dog.service ? ` - ${dog.service}` : ''}`; }
  function dogSmsLine(dog, index) { return `${index + 1} - ${dog.name || 'Dog'} - ${[dog.size, dog.breed].filter(Boolean).join(' ')}`.trim(); }
  function buildBookingPayload(form) {
    const payload = readFormData(form);
    const dogs = collectDogs(form);
    if (dogs[0]) { payload.dog_name = dogs[0].name; payload.dog_size = dogs[0].size; payload.breed = dogs[0].breed; payload.service = dogs[0].service; }
    payload.dogs = dogs.map(dog => ({ dog_name: dog.name, dog_size: dog.size, breed: dog.breed, service: dog.service }));
    payload.notes = [payload.notes || '', 'Dogs:', ...dogs.map((dog, index) => `Dog ${index + 1}: ${dogSummary(dog)}`)].filter(Boolean).join('\n');
    payload._dogs = dogs;
    return payload;
  }

  function bookingSmsBody(data) {
    const dogs = data._dogs && data._dogs.length ? data._dogs : [{ name: data.dog_name, size: data.dog_size, breed: data.breed, service: data.service }];
    const preferred = (data.preferred_time || '').trim();
    const date = (data.preferred_date || '').trim();
    const appointment = preferred && !/^whenever$/i.test(preferred)
      ? `I would like my appointment at ${[preferred, date].filter(Boolean).join(' ')}`
      : `I would like my appointment ${['whenever', date].filter(Boolean).join(' ')}`;
    const signoff = ['Cheers', data.owner_name || '', data.phone || ''].filter(Boolean).join(' ');
    return ["Hi Barking Mad Barbers I'd like to enquire about a dog.", '', ...dogs.map(dogSmsLine), '', appointment, '', signoff].filter((line, index, lines) => line || lines[index - 1] !== '').join('\n');
  }

  function bookingSmsUrl(data) {
    const encoded = encodeURIComponent(bookingSmsBody(data));
    const number = '+64272472493';
    if (/iPhone|iPad|iPod/i.test(navigator.userAgent)) return `sms:${number}&body=${encoded}`;
    return `sms:${number}?body=${encoded}`;
  }

  function canAutoOpenSms() { return /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent); }
  async function copyBookingSmsText(text) { try { await navigator.clipboard.writeText(text); return true; } catch { return false; } }

  function showBookingSmsFallback(data) {
    const url = bookingSmsUrl(data);
    const body = bookingSmsBody(data);
    const el = document.getElementById('bookingStatus');
    if (el) {
      el.innerHTML = `<div class="status good sms-open-card"><strong>Your text message is ready.</strong><p>If Messages does not open on this device, copy the text below and send it to 027 247 2493.</p><textarea class="sms-preview" readonly>${escapeHtml(body)}</textarea><div class="hero-actions"><button class="btn btn-gold" type="button" id="copySmsBtn">Copy text</button><a class="btn btn-soft" href="${url}">Open text message</a></div></div>`;
      const copyBtn = document.getElementById('copySmsBtn');
      if (copyBtn) copyBtn.onclick = async () => { copyBtn.textContent = await copyBookingSmsText(body) ? 'Copied' : 'Select and copy the text'; };
    }
    return url;
  }

  function openSms(form) {
    if (!form.reportValidity()) return;
    const data = buildBookingPayload(form);
    const url = showBookingSmsFallback(data);
    if (canAutoOpenSms()) window.location.href = url;
  }

  function refreshDogLabels(form) { form.querySelectorAll('[data-extra-dog]').forEach((card, index) => { const label = card.querySelector('[data-dog-label]'); if (label) label.textContent = `Dog ${index + 2}`; }); }
  function addDogCard(form) {
    const list = form.querySelector('.dog-list');
    if (!list) return;
    const card = document.createElement('div');
    card.className = 'dog-card';
    card.dataset.extraDog = 'true';
    card.innerHTML = `<div class="dog-card-head"><strong data-dog-label>Dog</strong><button class="remove-dog-btn" type="button">Remove</button></div><div class="dog-card-grid"><div class="field"><label>Dog name</label><input data-dog-name autocomplete="off"></div><div class="field"><label>Dog size</label><select data-dog-size><option value="">Choose size</option><option>Tiny</option><option>Small</option><option>Medium</option><option>Large</option></select></div><div class="field"><label>Breed</label><input data-dog-breed placeholder="Staffie, Pitbull, Cavoodle..."></div><div class="field"><label>Service</label><select data-dog-service><option value="">Choose service</option><option>Full Groom</option><option>Wash & Dry</option><option>Face Tidy</option><option>Nail Trim</option><option>Teeth Brush</option><option>Flea Shampoo</option></select></div></div>`;
    card.querySelector('.remove-dog-btn').onclick = () => { card.remove(); refreshDogLabels(form); };
    list.appendChild(card);
    refreshDogLabels(form);
    card.querySelector('[data-dog-breed]')?.focus();
  }
  function installMultiDogUi(form) {
    ensureFirstBreedField(form);
    ensureConsent(form);
    if (form.querySelector('#dogsList')) { form.querySelector('#addDogBtn')?.classList.add('add-dog-btn', 'full'); return; }
    if (form.querySelector('.dog-enquiry-panel')) return;
    const serviceField = form.service?.closest('.form-grid') || form.service?.closest('.field');
    if (!serviceField) return;
    const panel = document.createElement('section');
    panel.className = 'dog-enquiry-panel';
    panel.innerHTML = `<div class="dog-panel-head"><div class="dog-panel-title"><strong>Dogs for this enquiry</strong><span>Breed matters. Please add size and breed for every dog.</span></div><button class="add-dog-btn" type="button">+ Add dog</button></div><div class="dog-list" aria-live="polite"></div>`;
    serviceField.after(panel);
    panel.querySelector('.add-dog-btn').onclick = () => addDogCard(form);
  }
  function installBookingFallback() {
    installStyle();
    const form = document.getElementById('bookingForm');
    if (!form) return;
    wrapBookingForm(form);
    installMultiDogUi(form);
    form.onsubmit = event => { event.preventDefault(); setStatus(document.getElementById('bookingStatus'), 'Opening your text message...', 'good'); openSms(form); };
    document.getElementById('textToBookBtn')?.addEventListener('click', event => { event.preventDefault(); setStatus(document.getElementById('bookingStatus'), 'Opening your text message...', 'good'); openSms(form); });
  }

  window.fetch = (input, init) => { if (apiBase && typeof input === 'string' && input.startsWith('/api/')) input = apiBase + input; return nativeFetch(input, init); };
  history.replaceState(null, '', routePath);
  nativeFetch('/index.html?bmb_v=' + Date.now(), { cache: 'reload' }).then(response => response.text()).then(html => { document.open(); document.write(html); document.close(); setTimeout(installBookingFallback, 0); });
})();
</script>
